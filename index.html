<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° バーチャルマップ | ロガーズオートキャンプ那須高原</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: #f3f3f3;
    }

    /* 全体マップコンテナ（1080x1500 アスペクト比対応） */
    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      background-color: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .map-container {
      position: relative;
      width: 100%;
      /* 1080x1500のアスペクト比 (1500 / 1080 * 100 = 138.8888%) */
      padding-top: 138.8888%;
      background-image: url('images/map3.webp');
      background-size: cover;
      background-position: center;
    }

    /* カメラ位置ボタンのスタイル（📷 + 2桁番号） */
    .spot-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      background-color: rgba(208, 0, 0, 0.95); /* 赤系ベース */
      color: #F7F4EF;
      border: 2px solid #E6A100; /* 金/黄枠 */
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 2px;
      transition: transform 0.2s ease, filter 0.2s ease;
      
      /* 透過0%〜100%の点滅（3秒周期） */
      animation: pulse 3s infinite ease-in-out;
    }

    /* 透過0%〜100%の点滅キーフレーム */
    @keyframes pulse {
      0% {
        opacity: 0; /* 完全透明 */
        transform: translate(-50%, -50%) scale(0.95);
      }
      50% {
        opacity: 1; /* 不透明 100% */
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 12px rgba(230, 161, 0, 0.9);
      }
      100% {
        opacity: 0; /* 完全透明 */
        transform: translate(-50%, -50%) scale(0.95);
      }
    }

    /* ホバー時は不透明（100%）に固定して拡大 */
    .spot-pin:hover {
      animation-play-state: paused;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.25);
      background-color: #D00000;
      z-index: 20;
      box-shadow: 0 0 16px rgba(255, 215, 0, 1);
    }

    /* ツールチップ（スポット名表示） */
    .spot-pin::after {
      content: attr(data-name);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .spot-pin:hover::after {
      opacity: 1;
    }

    /* カラーピッカー用スタイル（Sketch Color Picker） */
    .vc-editable-input {
      position: relative;
    }
    .vc-input__input {
      padding: 0;
      border: 0;
      outline: none;
    }
    .vc-input__label {
      text-transform: capitalize;
    }

    .vc-saturation,
    .vc-saturation--white,
    .vc-saturation--black {
      cursor: pointer;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    .vc-saturation--white {
      background: linear-gradient(to right, #fff, rgba(255, 255, 255, 0));
    }
    .vc-saturation--black {
      background: linear-gradient(to top, #000, rgba(0, 0, 0, 0));
    }
    .vc-saturation-pointer {
      cursor: pointer;
      position: absolute;
    }
    .vc-saturation-circle {
      cursor: head;
      width: 4px;
      height: 4px;
      box-shadow: 0 0 0 1.5px #fff, inset 0 0 1px 1px rgba(0, 0, 0, 0.3), 0 0 1px 2px rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      transform: translate(-2px, -2px);
    }

    .vc-hue {
      position: absolute;
      top: 0px;
      right: 0px;
      bottom: 0px;
      left: 0px;
      border-radius: 2px;
    }
    .vc-hue--horizontal {
      background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
    }
    .vc-hue--vertical {
      background: linear-gradient(to top, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
    }
    .vc-hue-container {
      cursor: pointer;
      margin: 0 2px;
      position: relative;
      height: 100%;
    }
    .vc-hue-pointer {
      z-index: 2;
      position: absolute;
    }
    .vc-hue-picker {
      cursor: pointer;
      margin-top: 1px;
      width: 4px;
      border-radius: 1px;
      height: 8px;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
      background: #fff;
      transform: translateX(-2px);
    }

    .vc-sketch {
      position: relative;
      width: 200px;
      padding: 10px 10px 0;
      box-sizing: initial;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.15), 0 8px 16px rgba(0, 0, 0, 0.15);
    }
    .vc-sketch-saturation-wrap {
      width: 100%;
      padding-bottom: 75%;
      position: relative;
      overflow: hidden;
    }
    .vc-sketch-controls {
      display: flex;
    }
    .vc-sketch-sliders {
      padding: 4px 0;
      flex: 1;
    }
    .vc-sketch-sliders .vc-hue,
    .vc-sketch-sliders .vc-alpha-gradient {
      border-radius: 2px;
    }
    .vc-sketch-hue-wrap {
      position: relative;
      height: 10px;
    }
    .vc-sketch-alpha-wrap {
      position: relative;
      height: 10px;
      margin-top: 4px;
      overflow: hidden;
    }
    .vc-sketch-color-wrap {
      width: 24px;
      height: 24px;
      position: relative;
      margin-top: 4px;
      margin-left: 4px;
      border-radius: 3px;
    }
    .vc-sketch-active-color {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 2px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15), inset 0 0 4px rgba(0, 0, 0, 0.25);
      z-index: 2;
    }
    .vc-sketch-color-wrap .vc-checkerboard {
      background-size: auto;
    }
    .vc-sketch-field {
      display: flex;
      padding-top: 4px;
    }
    .vc-sketch-field .vc-input__input {
      width: 90%;
      padding: 4px 0 3px 10%;
      border: none;
      box-shadow: inset 0 0 0 1px #ccc;
      font-size: 10px;
    }
    .vc-sketch-field .vc-input__label {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #222;
      padding-top: 3px;
      padding-bottom: 4px;
      text-transform: capitalize;
    }
    .vc-sketch-field--single {
      flex: 1;
      padding-left: 6px;
    }
    .vc-sketch-field--double {
      flex: 2;
    }
    .vc-sketch-presets {
      margin-right: -10px;
      margin-left: -10px;
      padding-left: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .vc-sketch-presets-color {
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      display: inline-block;
      margin: 0 10px 10px 0;
      vertical-align: top;
      cursor: pointer;
      width: 16px;
      height: 16px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
    }
    .vc-sketch-presets-color .vc-checkerboard {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      border-radius: 3px;
    }
    .vc-sketch__disable-alpha .vc-sketch-color-wrap {
      height: 10px;
    }
  </style>
</head>
