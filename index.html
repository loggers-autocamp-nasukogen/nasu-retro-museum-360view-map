<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>360° バーチャルマップ | ロガーズオートキャンプ那須高原</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      color: #f3f3f3;
    }

    /* 全体マップコンテナ（1080x1500 アスペクト比対応） */
    .map-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      background-color: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .map-container {
      position: relative;
      width: 100%;
      /* 1080x1500のアスペクト比 (1500 / 1080 * 100 = 138.8888%) */
      padding-top: 138.8888%;
      background-image: url('images/map.webp');
      background-size: cover;
      background-position: center;
    }

    /* カメラ位置ボタンのスタイル（📷 + 2桁番号） */
    .spot-pin {
      position: absolute;
      transform: translate(-50%, -50%);
      background-color: rgba(208, 0, 0, 0.9); /* 赤系ベース */
      color: #F7F4EF;
      border: 2px solid #E6A100; /* 金/黄枠 */
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 2px;
      transition: transform 0.2s ease, filter 0.2s ease;
      
      /* じんわり点滅のアニメーション適用 */
      animation: pulse 2.5s infinite ease-in-out;
    }

    /* じんわり点滅（フェード＆微拡大＆光彩）キーフレーム */
    @keyframes pulse {
      0% {
        opacity: 0.82;
        transform: translate(-50%, -50%) scale(0.96);
        box-shadow: 0 0 4px rgba(230, 161, 0, 0.4);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 12px rgba(230, 161, 0, 0.9);
      }
      100% {
        opacity: 0.82;
        transform: translate(-50%, -50%) scale(0.96);
        box-shadow: 0 0 4px rgba(230, 161, 0, 0.4);
      }
    }

    /* ホバー時は拡大して強調（アニメーション一時停止） */
    .spot-pin:hover {
      animation-play-state: paused;
      transform: translate(-50%, -50%) scale(1.25);
      background-color: #D00000;
      z-index: 20;
      box-shadow: 0 0 16px rgba(255, 215, 0, 1);
    }

    /* ツールチップ（スポット名表示） */
    .spot-pin::after {
      content: attr(data-name);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .spot-pin:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <h1>360° バーチャルマップ</h1>
  </header>

  <div class="map-wrapper">
    <!-- 全体マップ表示エリア -->
    <div class="map-container" id="mapContainer"></div>
  </div>

  <script>
    // ====================================================
    // spot1 ～ spot28 の設定データ
    // ====================================================
    const mapConfig = {
      spots: [
        { id: 1,  name: "スポット 01", x: 10.0, y: 20.0, url: "spot1.html" },
        { id: 2,  name: "スポット 02", x: 15.0, y: 30.0, url: "spot2.html" },
        { id: 3,  name: "スポット 03", x: 20.0, y: 25.0, url: "spot3.html" },
        { id: 4,  name: "スポット 04", x: 25.0, y: 40.0, url: "spot4.html" },
        { id: 5,  name: "スポット 05", x: 30.0, y: 35.0, url: "spot5.html" },
        { id: 6,  name: "スポット 06", x: 35.0, y: 50.0, url: "spot6.html" },
        { id: 7,  name: "スポット 07", x: 40.0, y: 45.0, url: "spot7.html" },
        { id: 8,  name: "スポット 08", x: 45.0, y: 60.0, url: "spot8.html" },
        { id: 9,  name: "スポット 09", x: 50.0, y: 30.0, url: "spot9.html" },
        { id: 10, name: "スポット 10", x: 55.0, y: 65.0, url: "spot10.html" },
        { id: 11, name: "スポット 11", x: 60.0, y: 25.0, url: "spot11.html" },
        { id: 12, name: "スポット 12", x: 65.0, y: 55.0, url: "spot12.html" },
        { id: 13, name: "スポット 13", x: 70.0, y: 35.0, url: "spot13.html" },
        { id: 14, name: "スポット 14", x: 75.0, y: 70.0, url: "spot14.html" },
        { id: 15, name: "スポット 15", x: 80.0, y: 40.0, url: "spot15.html" },
        { id: 16, name: "スポット 16", x: 85.0, y: 75.0, url: "spot16.html" },
        { id: 17, name: "スポット 17", x: 90.0, y: 30.0, url: "spot17.html" },
        { id: 18, name: "スポット 18", x: 15.0, y: 70.0, url: "spot18.html" },
        { id: 19, name: "スポット 19", x: 22.0, y: 80.0, url: "spot19.html" },
        { id: 20, name: "スポット 20", x: 32.0, y: 75.0, url: "spot20.html" },
        { id: 21, name: "スポット 21", x: 42.0, y: 85.0, url: "spot21.html" },
        { id: 22, name: "スポット 22", x: 52.0, y: 80.0, url: "spot22.html" },
        { id: 23, name: "スポット 23", x: 62.0, y: 85.0, url: "spot23.html" },
        { id: 24, name: "スポット 24", x: 72.0, y: 80.0, url: "spot24.html" },
        { id: 25, name: "スポット 25", x: 82.0, y: 85.0, url: "spot25.html" },
        { id: 26, name: "スポット 26", x: 88.0, y: 50.0, url: "spot26.html" },
        { id: 27, name: "スポット 27", x: 92.0, y: 65.0, url: "spot27.html" },
        { id: 28, name: "スポット 28", x: 95.0, y: 80.0, url: "spot28.html" }
      ]
    };

    // DOM要素の生成と初期化
    document.addEventListener('DOMContentLoaded', () => {
      const mapContainer = document.getElementById('mapContainer');

      // ピン（📷XX ボタン）を動的に28箇所生成
      mapConfig.spots.forEach(spot => {
        const pin = document.createElement('a');
        pin.className = 'spot-pin';
        pin.style.left = spot.x + '%';
        pin.style.top = spot.y + '%';
        
        // IDを2桁ゼロ埋め表記（例: 1 -> 01）
        const formattedId = String(spot.id).padStart(2, '0');
        pin.textContent = `📷${formattedId}`;
        
        pin.setAttribute('data-name', spot.name);
        pin.href = spot.url;

        mapContainer.appendChild(pin);
      });
    });
  </script>
</body>
</html>
